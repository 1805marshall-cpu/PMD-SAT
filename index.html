<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema PMD 2026-2029 - San Andrés Tuxtla</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-slate-100 antialiased font-sans flex items-center justify-center min-h-screen p-4 relative overflow-hidden">

    <!-- Contenedor de Notificaciones Estilizadas (Toasts) -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 space-y-3 pointer-events-none"></div>

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden space-y-6 p-8 relative z-10">
        
        <!-- Identidad Institucional -->
        <div class="text-center space-y-2">
            <img src="img/2.png" alt="San Andrés Tuxtla 2026-2029" class="h-16 mx-auto object-contain">
            <h1 class="text-lg font-bold text-slate-900 leading-tight">Sistema de Seguimiento PMD</h1>
            <p class="text-xs text-slate-500">H. Ayuntamiento de San Andrés Tuxtla</p>

        </div>

        <!-- Formulario de Inicio de Sesión por Usuario y Contraseña -->
        <form id="formLogin" onsubmit="procesarAcceso(event)" class="space-y-4">
            
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Usuario Institucional</label>
                <input type="text" id="inputUsuario" placeholder="Ej. dif, obras, admin..." required 
                       class="w-full text-xs border border-slate-300 rounded-md p-3 text-slate-900 focus:ring-1 focus:ring-[#7A1C30] focus:border-[#7A1C30] outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Contraseña de Acceso</label>
                <input type="password" id="inputPassword" placeholder="••••••••" required 
                       class="w-full text-xs border border-slate-300 rounded-md p-3 text-slate-900 focus:ring-1 focus:ring-[#7A1C30] focus:border-[#7A1C30] outline-none transition">
            </div>

            <!-- Aviso de Acceso -->
            <div class="bg-amber-50 border border-amber-200 p-3 rounded-md">
                <p class="text-[11px] text-amber-800 leading-relaxed">
                    <strong>Acceso Controlado:</strong> El sistema validará su usuario y le redirigirá automáticamente a su módulo correspondiente.
                </p>
            </div>

            <!-- Botón de Ingreso -->
            <button type="submit" id="btnIngresar" 
                    class="w-full py-3 text-xs font-bold text-white bg-[#7A1C30] hover:bg-[#521220] rounded-md transition shadow-sm flex items-center justify-center space-x-2">
                <span>Iniciar Sesión</span>
            </button>
        </form>

        <div class="text-center border-t border-slate-100 pt-4">
            <p class="text-[11px] text-slate-400">Si olvidó sus credenciales de acceso, contacte a la Coordinación de Soporte Técnico.</p>
        </div>
    </div>

    <!-- Script de la aplicación y lógica de notificaciones estilizadas -->
    <script src="js/app.js"></script>
    <script>
        function mostrarNotificacion(mensaje, tipo = 'exito') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const bgColor = tipo === 'exito' ? 'bg-emerald-900/95 border-emerald-700 text-white' : 'bg-rose-900/95 border-rose-700 text-white';
            const icono = tipo === 'exito' ? '✨' : '⚠️';

            toast.className = `pointer-events-auto flex items-center space-x-3 px-4 py-3 rounded-lg shadow-xl border backdrop-blur-md text-xs font-semibold transition-all duration-300 transform translate-y-2 opacity-0 ${bgColor}`;
            toast.innerHTML = `<span>${icono}</span> <span>${mensaje}</span>`;
            
            container.appendChild(toast);

            // Animación de entrada
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            // Desvanecimiento automático
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function procesarAcceso(e) {
            e.preventDefault();
            const usuario = document.getElementById('inputUsuario').value.trim().toLowerCase();
            const password = document.getElementById('inputPassword').value;
            const btn = document.getElementById('btnIngresar');

            btn.disabled = true;
            btn.innerHTML = `<svg class="animate-spin h-4 w-4 text-white mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>`;

            // Simular breve pausa visual de carga y validar credenciales
            setTimeout(() => {
                const resultado = iniciarSesionUsuario(usuario, password);

                if (resultado.exito) {
                    mostrarNotificacion(`¡Bienvenido al sistema, ${resultado.dep}! Redirigindo...`, 'exito');
                    setTimeout(() => {
                        window.location.href = resultado.ruta;
                    }, 1000);
                } else {
                    mostrarNotificacion("Error: Usuario o contraseña incorrectos.", 'error');
                    btn.disabled = false;
                    btn.innerHTML = "<span>Iniciar Sesión</span>";
                }
            }, 600);
        }
    </script>
</body>
</html>
